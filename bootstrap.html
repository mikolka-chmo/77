<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три картки — Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="./cards.css">
</head>
<body>
  <section class="cards-section">
    <div class="container">
      <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
        <div class="col">
          <div class="card feature-card feature-card--one shadow-sm">
            <div class="card-body p-4">
              <div class="feature-card__icon">🚀</div>
              <h5 class="card-title">Швидкий старт</h5>
              <p class="card-text text-secondary">Підключіть бібліотеку через CDN і починайте верстати без жодного налаштування.</p>
              <a href="#" class="feature-card__btn">Детальніше</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card feature-card feature-card--two shadow-sm">
            <div class="card-body p-4">
              <div class="feature-card__icon">📱</div>
              <h5 class="card-title">Адаптивність</h5>
              <p class="card-text text-secondary">Одна колонка на телефоні, дві на планшеті та три у ряд на десктопі.</p>
              <a href="#" class="feature-card__btn">Детальніше</a>
            </div>
          </div>
        </div>
        <div class="col">
          <div class="card feature-card feature-card--three shadow-sm">
            <div class="card-body p-4">
              <div class="feature-card__icon">🎨</div>
              <h5 class="card-title">SCSS-стилі</h5>
              <p class="card-text text-secondary">Змінні, міксини та цикли SCSS компілюються просто в браузері.</p>
              <a href="#" class="feature-card__btn">Детальніше</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
