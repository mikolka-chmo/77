<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Три картки — Bulma</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.2/css/bulma.min.css">
<link rel="stylesheet" href="./cards.css">
</head>
<body>
  <section class="cards-section">
    <div class="container">
      <div class="columns is-multiline">
        <div class="column is-12-mobile is-6-tablet is-4-desktop">
          <div class="card feature-card feature-card--one">
            <div class="card-content">
              <div class="feature-card__icon">🚀</div>
              <p class="title is-5">Швидкий старт</p>
              <p class="content has-text-grey">Підключіть бібліотеку через CDN і починайте верстати без жодного налаштування.</p>
              <a href="#" class="feature-card__btn">Детальніше</a>
            </div>
          </div>
        </div>
        <div class="column is-12-mobile is-6-tablet is-4-desktop">
          <div class="card feature-card feature-card--two">
            <div class="card-content">
              <div class="feature-card__icon">📱</div>
              <p class="title is-5">Адаптивність</p>
              <p class="content has-text-grey">Одна колонка на телефоні, дві на планшеті та три у ряд на десктопі.</p>
              <a href="#" class="feature-card__btn">Детальніше</a>
            </div>
          </div>
        </div>
        <div class="column is-12-mobile is-6-tablet is-4-desktop">
          <div class="card feature-card feature-card--three">
            <div class="card-content">
              <div class="feature-card__icon">🎨</div>
              <p class="title is-5">SCSS-стилі</p>
              <p class="content has-text-grey">Змінні, міксини та цикли SCSS компілюються просто в браузері.</p>
              <a href="#" class="feature-card__btn">Детальніше</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>
</body>
</html>
